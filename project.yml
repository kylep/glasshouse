# XcodeGen manifest. The .xcodeproj is generated from this file and gitignored,
# so no agent or human ever edits a .pbxproj. Regenerate with:
#
#     scripts/bootstrap.sh
#
# Info.plist usage-description keys are deliberately NOT hand-written here.
# From Phase 1 they are generated from capability-ledger.yml, so that a sensor
# can never ship without a declared purpose string. See docs/architecture.md.
name: Glasshouse

options:
  bundleIdPrefix: fit.glasshouse
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"

packages:
  Glasshouse:
    path: .

targets:
  Glasshouse:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Glasshouse
        product: GlasshouseCore
      - package: Glasshouse
        product: GlasshouseSensors
    # HealthKit is signable by a FREE personal team — confirmed against both
    # Apple's capability matrix and Xcode's own portal cache. That is the
    # counterintuitive finding this project started from, so it is worth
    # actually exercising rather than leaving as a claim in a document.
    entitlements:
      path: App/Glasshouse.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fit.glasshouse.app
        PRODUCT_NAME: Glasshouse
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.2"
        TARGETED_DEVICE_FAMILY: "1"
        # Info.plist is generated from the capability ledger by
        # `scripts/bootstrap.sh`, so a sensor cannot ship without a declared
        # purpose string. Do not switch this back to GENERATE_INFOPLIST_FILE.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Generated/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
